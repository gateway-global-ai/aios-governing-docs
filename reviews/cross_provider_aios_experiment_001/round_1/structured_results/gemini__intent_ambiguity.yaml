summary: The assistant correctly identified the user's distress and ambiguity. Instead
  of inventing a product direction, it effectively challenged the 'AI OS' scope and
  redefined the immediate goal as a customer discovery process. The advice is grounded,
  actionable, and de-escalates pressure by providing a small, real next step that
  avoids pushing the user toward an unvalidated solution.
evidence_quotes:
- Let's pause the 'AI OS' question for a moment.
- Instead of trying to guess what the first app should be, let's find it by focusing
  on a person, not a product.
- Your only job right now is to become an expert on a specific person's problem. Don't
  try to solve it in the conversation, just understand it deeply.
notes:
- The empathetic opening paragraph is a very effective way to ground a user who is
  feeling pressured and uncertain.
- The use of historical examples (Windows, iOS) helps connect the user's large ambition
  to a pragmatic and proven starting point.
