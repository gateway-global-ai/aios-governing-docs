kit_id: voice_first_ui_artifact_kit
version: 0.5.0
status: draft
library_root: sdk/voice_first_ui_artifact_kit
schema_path: sdk/voice_first_ui_artifact_kit/voice_first_ui_artifact_kit_manifest.schema.json
governing_standard:
  document_id: AIOS-VOICE-FIRST-UI-ARTIFACT-KIT-STANDARD-001
  document_path: reference/implementation/AIOS-VOICE-FIRST-UI-ARTIFACT-KIT-STANDARD-001.md
registry_mapping:
  source_class: governed-kit
  component_id_prefix: vf-kit-
  normalization_rule: lowercase and replace "." and "_" with "-"
delivery_surfaces:
  - repo_local_governed_library
  - governed_runtime_package
  - future_dependency_surface
  - future_mcp_surface
main_shell_artifacts:
  - artifact_id: header
    artifact_label: Header
    surface_zone: shell
    artifact_kind: structural
    interactive: true
    voice_first_role: authority_and_disclosure
    required_controls: []
    required_visual_proofs:
      - surface_proof
      - control_proof
    related_governing_docs:
      - AMD-2026-007
      - AMD-2026-012
  - artifact_id: header.attached_menu
    artifact_label: HeaderAttachedMenu
    surface_zone: shell
    artifact_kind: control
    interactive: true
    voice_first_role: authority_and_disclosure
    required_controls: []
    required_visual_proofs:
      - surface_proof
      - control_proof
      - behavior_proof
    related_governing_docs:
      - AMD-2026-012
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
  - artifact_id: header.audio_player_cluster
    artifact_label: HeaderAudioPlayerCluster
    surface_zone: shell
    artifact_kind: control
    interactive: true
    voice_first_role: operator_visible_runtime_control
    required_controls:
      - play
      - pause
    required_visual_proofs:
      - control_proof
      - behavior_proof
    related_governing_docs:
      - AIOS-VOICE-TTS-ARCHITECTURE-STANDARD-001
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
  - artifact_id: header.cue_drawer
    artifact_label: HeaderCueDrawer
    surface_zone: shell
    artifact_kind: control
    interactive: true
    voice_first_role: operator_visible_runtime_control
    required_controls:
      - play
      - pause
    required_visual_proofs:
      - control_proof
      - behavior_proof
    related_governing_docs:
      - AIOS-VOICE-TTS-ARCHITECTURE-STANDARD-001
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
  - artifact_id: header.system_control_panel
    artifact_label: HeaderSystemControlPanel
    surface_zone: shell
    artifact_kind: control
    interactive: true
    voice_first_role: operator_visible_runtime_control
    required_controls: []
    required_visual_proofs:
      - control_proof
      - state_proof
    related_governing_docs:
      - AIOS-VOICE-TTS-ARCHITECTURE-STANDARD-001
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
  - artifact_id: canvas
    artifact_label: Canvas
    surface_zone: shell
    artifact_kind: structural
    interactive: true
    voice_first_role: primary_surface
    required_controls: []
    required_visual_proofs:
      - surface_proof
      - state_proof
    related_governing_docs:
      - AMD-2026-007
      - AMD-2026-012
  - artifact_id: footer
    artifact_label: Footer
    surface_zone: shell
    artifact_kind: structural
    interactive: true
    voice_first_role: action_and_navigation
    required_controls:
      - close
    required_visual_proofs:
      - control_proof
      - behavior_proof
    related_governing_docs:
      - AMD-2026-012
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
deployment_packages:
  - package_id: header_voice_runtime_package
    package_label: Header Voice Runtime Package
    deployment_scope: header_voice_runtime
    package_manifest_path: sdk/voice_first_ui_artifact_kit/header_voice_runtime_package_manifest.yaml
    included_artifacts:
      - header
      - header.attached_menu
      - header.audio_player_cluster
      - header.cue_drawer
      - header.system_control_panel
    runtime_components:
      - src/App.tsx
      - src/components/shell/ShellIdentityBar.tsx
      - src/components/shell/ShellSystemControls.tsx
      - src/components/shell/VoiceControlPanel.tsx
      - src/components/shell/VoiceBoxPanel.tsx
      - src/components/shell/AppearanceOverlay.tsx
      - src/core/io/GeminiVoiceEngine.ts
      - src/core/io/BrowserVoiceEngine.ts
      - src/core/io/SovereignVoiceEngine.ts
      - src/core/io/VoiceboxClient.ts
      - src/config/voiceRoutePreference.ts
      - src/api/geminiGateway.ts
      - server/geminiServe.ts
      - server/prodHost.ts
      - vite/localModelPlugin.ts
    governing_docs:
      - AIOS-VOICE-FIRST-UI-ARTIFACT-KIT-STANDARD-001
      - AIOS-VOICE-TTS-ARCHITECTURE-STANDARD-001
      - AIOS-SHELL-UI-LAYOUT-AND-COMPONENT-STANDARD-001
