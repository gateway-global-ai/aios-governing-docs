multi_step_navigation_contract:
  applies_to:
    - canvas.overlay_card.3_1
    - canvas.agent_controls.6_1
  required_elements:
    - top_right_progress_label_x_of_y
    - back_button
    - close_button
  notes:
    - Multi-step cards and slides must not omit basic navigation on the assumption that narration or agent guidance is sufficient.
